name: AQI Data Pipeline Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - dev
          - prod

      operation:
        description: "Terraform action to perform, e.g. apply or destroy"
        required: true
        type: choice
        options:
          - apply
          - destroy

jobs:
  trigger-platform-cicd:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Trigger platform CI/CD
        env:
          GH_TOKEN: ${{ secrets.CICD_TRIGGER_TOKEN }}
        run: |
          curl -L -sS -f \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/repos/Housing-Intelligence/hi-platform-cicd/actions/workflows/terraform.yml/dispatches \
            -d '{
            "ref": "main",
            "inputs": {
              "target_repository": "Housing-Intelligence/hi-aqi",
              "terraform_directory": "terraform",
              "infra_name": "aqi",
              "environment": "${{ inputs.environment }}",
              "operation": "${{ inputs.operation }}",
              "parameters_json": "{\"waqi_secret\":\"${{ secrets.WAQI_SECRET }}\"}"
            }
          }'
